<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Paiement | Librairie & Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-store"></i> Librairie & Boutique
        </a>
    </div>
</nav>

<!-- ================= CONTENU ================= -->
<main class="container mt-5 pt-5">

    <section class="mb-5">
        <h1 class="display-5 fw-bold text-primary">
            <i class="fas fa-envelope"></i> Contact & Paiement
        </h1>
        <p class="lead">Contactez-nous pour toute question</p>
    </section>

    <!-- ================= FORMULAIRE ================= -->
    <section class="mb-5">
        <h2 class="mb-4">
            <i class="fas fa-comment-dots text-secondary"></i> Formulaire de Contact
        </h2>

        <div class="row">
            <div class="col-md-8">
                <form action="https://formsubmit.co/mfesdona025@gmail.com" method="POST" class="bg-light p-4 rounded">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nom complet *</label>
                            <input type="text" class="form-control" name="nom" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" name="telephone">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sujet *</label>
                            <select class="form-select" name="sujet" required>
                                <option value="">Sélectionnez un sujet</option>
                                <option value="commande">Question sur une commande</option>
                                <option value="livraison">Question sur la livraison</option>
                                <option value="produit">Information sur un produit</option>
                                <option value="paiement">Question sur le paiement</option>
                                <option value="autre">Autre</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message *</label>
                        <textarea class="form-control" name="message" rows="5" required></textarea>
                    </div>

                    <!-- Paramètres FormSubmit -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="Nouveau message depuis votre site">

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>Envoyer le message
                    </button>

                </form>
            </div>
        </div>
    </section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-dark text-light py-4">
    <div class="container text-center">
        <p>&copy; 2026 Librairie & Boutique. Tous droits réservés.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
